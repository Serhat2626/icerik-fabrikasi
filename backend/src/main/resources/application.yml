spring:
  application:
    name: icerik-fabrikasi-platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:icerik_fabrikasi}
    username: ${POSTGRES_USER:icerik}
    password: ${POSTGRES_PASSWORD:icerik_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  redis:
    enabled: true
  storage:
    s3:
      region: ${AWS_REGION:eu-central-1}
      bucket: ${APP_STORAGE_S3_BUCKET:icerik-fabrikasi-dev}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# JWT Authentication
jwt:
  secret: ${JWT_SECRET:icerik-fabrikasi-dev-secret-key-minimum-256-bits-2026-change-in-production}
  expiration-ms: 86400000  # 24 saat

pexels:
  api-key: REDACTED_SECRET

# ElevenLabs Text-to-Speech
elevenlabs:
  api-key: REDACTED_ELEVENLABS_API_KEY
  voice-id: ${ELEVENLABS_VOICE_ID:pNInz6obpgDQGcFmaJgB}  # Adam - erkek, İngilizce
  model: eleven_turbo_v2_5  # Hızlı + ucuz model

fal:
  api-key: REDACTED_FAL_API_KEY
  model: fal-ai/flux-pro/v1.1