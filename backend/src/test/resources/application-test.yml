spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  redis:
    enabled: false
  storage:
    s3:
      region: eu-central-1
      bucket: test-bucket
      access-key:
      secret-key:

jwt:
  secret: test-secret-key-minimum-256-bits-for-unit-testing-purposes-only-2026
  expiration-ms: 86400000

logging:
  level:
    com.icerikfabrikasi.platform: WARN
    org.hibernate.SQL: WARN
