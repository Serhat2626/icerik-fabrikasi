name: CI/CD Deploy Pipeline

on:
  push:
    branches:
      - alignerr-dev
      - main
  pull_request:
    branches:
      - alignerr-dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test-and-package:
    name: Backend Test & Package (Java 21 + PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: icerik_fabrikasi
          POSTGRES_USER: icerik
          POSTGRES_PASSWORD: icerik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven tests and package JAR
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: icerik_fabrikasi
          POSTGRES_USER: icerik
          POSTGRES_PASSWORD: icerik_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: mvn clean package -B

      - name: Upload Backend JAR artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.ref_name }}
          path: backend/target/*.jar
          retention-days: 14

  frontend-build:
    name: Frontend Lint & Build (Node 22 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: frontend/dist
          retention-days: 14
